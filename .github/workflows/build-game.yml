name: Rebuild published game

on:
  push:
    branches: [ main ]
    paths:
      - "engine/browser/src/**"
      - "engine/browser/out/**"
      - "engine/data/**"
      - "engine/deckbuilder/**"
      - ".github/workflows/build-game.yml"

permissions:
  contents: write

jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build single-file game
        working-directory: engine/browser
        run: node build-html.mjs
      - name: Build Deck Builder
        working-directory: engine/deckbuilder
        run: node build.mjs
      - name: Publish generated HTML
        run: |
          cp engine/browser/out/goat.html goat-simulador.html
          cp engine/deckbuilder/deckbuilder.html deckbuilder.html
      - name: Commit generated pages if changed
        shell: bash
        run: |
          if git diff --quiet -- goat-simulador.html deckbuilder.html; then
            echo "Published pages are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goat-simulador.html deckbuilder.html
          git commit -m "Rebuild published game pages"
          git push
